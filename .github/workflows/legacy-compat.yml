name: legacy-compat

on:
  workflow_dispatch:
  schedule:
    # 03:30 UTC daily
    - cron: '30 3 * * *'

jobs:
  legacy-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SqlProjectSync.slnx

      - name: Build
        run: dotnet build -c Release SqlProjectSync.slnx --no-restore

      - name: Legacy compat tests (SQL Server 2022 container)
        continue-on-error: true
        run: dotnet test -c Release tests/SqlProjectSync.IntegrationTests/SqlProjectSync.IntegrationTests.csproj --no-build -- --filter-trait Style=Legacy
