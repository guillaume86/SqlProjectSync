name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-localdb:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SqlProjectSync.slnx

      - name: Build
        run: dotnet build -c Release SqlProjectSync.slnx --no-restore

      - name: Unit tests
        run: dotnet test -c Release tests/SqlProjectSync.Tests/SqlProjectSync.Tests.csproj --no-build

      - name: SDK integration tests (LocalDB)
        run: dotnet test -c Release tests/SqlProjectSync.IntegrationTests/SqlProjectSync.IntegrationTests.csproj --no-build --filter "Backend=LocalDb"

  linux-sql2022-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SqlProjectSync.slnx

      - name: Build
        run: dotnet build -c Release SqlProjectSync.slnx --no-restore

      - name: Unit tests
        run: dotnet test -c Release tests/SqlProjectSync.Tests/SqlProjectSync.Tests.csproj --no-build

      - name: SDK integration tests (SQL Server 2022 container)
        run: dotnet test -c Release tests/SqlProjectSync.IntegrationTests/SqlProjectSync.IntegrationTests.csproj --no-build --filter "Backend=Sql2022Container"
