name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-sql2022-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # MinVer reads git tags to stamp the assembly version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SqlProjectSync.slnx

      - name: Build
        run: dotnet build -c Release SqlProjectSync.slnx --no-restore

      - name: Unit tests
        run: dotnet test -c Release tests/SqlProjectSync.Tests/SqlProjectSync.Tests.csproj --no-build

      - name: SDK integration tests (SQL Server 2022 container)
        run: dotnet test -c Release tests/SqlProjectSync.IntegrationTests/SqlProjectSync.IntegrationTests.csproj --no-build -- --filter-not-trait Style=Legacy
